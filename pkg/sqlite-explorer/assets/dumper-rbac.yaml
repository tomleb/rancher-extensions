apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqlite-explorer-dumper
  namespace: cattle-system
  labels:
    sqlite-explorer: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sqlite-explorer-dumper
  namespace: cattle-system
  labels:
    sqlite-explorer: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["patch", "update", "get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sqlite-explorer-dumper
  namespace: cattle-system
  labels:
    sqlite-explorer: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sqlite-explorer-dumper
subjects:
  - kind: ServiceAccount
    name: sqlite-explorer-dumper
    namespace: cattle-system
